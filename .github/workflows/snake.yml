name: Generate contribution snake

# Builds github-contribution-grid-snake.svg (+ -dark) into the `output`
# branch. README.md references those files via raw.githubusercontent.com,
# so they render only after this workflow has run at least once.

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # manual trigger for the first run
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
